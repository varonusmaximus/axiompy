[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "axiompy"
version = "2.0.0"
description = "Core utilities, I/O, servers, and cross-cutting concerns for Python projects"
readme = "README.md"
license = "MIT"
authors = ["Jorge Varona <varonusmaximus@users.noreply.github.com>"]
keywords = ["utilities", "logging", "validation", "decorators", "http", "database"]
packages = [
    { include = "axiompy" },
    { include = "axiompy_skills", from = "bundles" },
]
include = [
    { path = "bundles/axiompy_skills/**/*.md", format = ["sdist", "wheel"] },
    { path = "bundles/axiompy_skills/**/*.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"
pytest-timeout = ">=2.2.0"
pre-commit = ">=3.5.0"
bandit = ">=1.8.6"
pip-audit = ">=2.6.0"
ruff = ">=0.1.0"
black = ">=23.0.0"
flake8 = ">=6.0.0"
mypy = ">=1.4.0"
tqdm = ">=4.65.0"
pyyaml = ">=6.0"
requests = ">=2.28.0"
httpx = ">=0.27.0"

[project]
name = "axiompy"
version = "2.0.0"
description = "Core utilities, I/O, servers, and cross-cutting concerns for Python projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jorge Varona", email = "varonusmaximus@users.noreply.github.com" }]
keywords = ["utilities", "logging", "validation", "decorators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
axiompy-skills = "axiompy.cli.cursor_skills:main"

[project.urls]
Repository = "https://github.com/varonusmaximus/axiompy"
Documentation = "https://github.com/varonusmaximus/axiompy#readme"

[project.optional-dependencies]
skills = []
http = ["requests>=2.28.0"]
http-async = ["httpx>=0.27.0"]
tqdm = ["tqdm>=4.65.0"]
yaml = ["pyyaml>=6.0"]
postgres = ["psycopg2-binary>=2.9.0"]
mysql = ["mysql-connector-python>=8.0.0"]
dynamodb = ["boto3>=1.26.0"]
databases = [
    "psycopg2-binary>=2.9.0",
    "mysql-connector-python>=8.0.0",
    "boto3>=1.26.0",
]
s3 = ["boto3>=1.26.0"]
gcs = ["google-cloud-storage>=2.10.0"]
azure = ["azure-storage-blob>=12.19.0"]
storage = [
    "boto3>=1.26.0",
    "google-cloud-storage>=2.10.0",
    "azure-storage-blob>=12.19.0",
]
flask = ["flask>=2.3.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.27.0"]
servers = [
    "flask>=2.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.2.0",
    "pre-commit>=3.5.0",
    "bandit>=1.8.6",
    "pip-audit>=2.6.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "httpx>=0.27.0",
]
# Optional: pull sibling distributions from the same index when published separately.
data = ["axiompy-data>=2.0.0,<3.0.0"]
agents = ["axiompy-agents>=2.0.0,<3.0.0"]
all = ["axiompy-data>=2.0.0,<3.0.0", "axiompy-agents>=2.0.0,<3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["axiompy"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

[tool.bandit]
skips = ["B608", "B314"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "ARG",
    "SIM",
]

ignore = [
    "E501",
    "F821",
    "ARG002",
    "ARG001",
    "ARG004",
    "B904",
    "N812",
    "SIM102",
    "ARG005",
    "F841",
    "UP035",
    "SIM117",
    "B027",
    "F401",
    "F822",
    "B023",
    "N818",
    "B008",
    "B011",
    "B017",
    "UP028",
    "B007",
    "W291",
    "SIM118",
    "UP006",
    "UP007",
    "UP045",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "I001", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_strict_optional = true

[tool.pylint.main]
py-version = "3.12"
jobs = 0
limit-inference-results = 100
ignore-patterns = ["test_.*\\.py"]

[tool.pylint.messages_control]
disable = [
    "R0801",
    "E0401",
    "E0611",
    "I1101",
    "C0415",
    "W0718",
    "R0902",
    "R0912",
    "R0913",
    "R0917",
    "C0302",
    "W0221",
    "W0222",
    "W0231",
    "W0613",
    "W0640",
    "R0903",
    "W0622",
    "W1203",
    "W0212",
    "E1101",
    "W0603",
    "C0103",
    "W0621",
    "W0404",
    "E0603",
    "W2301",
    "R1710",
    "R1731",
    "W0719",
    "R0914",
    "R0915",
    "R1702",
    "W1309",
    "W0611",
    "W0107",
    "W0707",
    "R1705",
    "R0911",
    "E1131",
    "W0108",
    "W0612",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-branches = 15
