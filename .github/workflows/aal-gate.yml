name: AAL Constraint Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  verify-aal-domains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install consumer project + axiom-aal
        run: |
          pip install -e ".[dev]"
          pip install "axiom-aal @ git+https://github.com/varonusmaximus/axiom-aal@v1.3.0"

      - name: AAL doctor (strict)
        run: aal doctor --strict

      - name: Collect changed source files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$RANGE" \
            | grep -E '\.(py|ts|js|go|rs|java|sql|vue|html|sh)$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${FILES[@]}" > changed_aal_files.txt
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AAL verify-domains (strict, changed files)
        if: steps.changed.outputs.has_files == 'true'
        run: xargs -a changed_aal_files.txt aal verify-domains --strict --files

      - name: AAL verify-domains (strict, full scan fallback)
        if: steps.changed.outputs.has_files != 'true'
        run: aal verify-domains --strict
