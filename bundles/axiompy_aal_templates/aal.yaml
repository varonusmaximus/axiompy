version: "1.3"
skills_package: axiompy
skills_package_version: "2.0.0"
scan_entire_file: true
header_scan_lines: 50
max_domains_per_annotation: 3
ignore_dirs:
  - .git
  - node_modules
  - __pycache__
  - venv
  - .venv
  - .tmpvenv
  - .ci-venv
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - dist
  - build
  - htmlcov
extensions:
  - .py
  - .ts
  - .js
  - .go
  - .rs
  - .java
  - .sql
  - .vue
  - .html
  - .sh
